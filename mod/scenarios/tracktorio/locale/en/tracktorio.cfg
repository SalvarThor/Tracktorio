scenario-name=Tracktorio
description=Factorio where the trains are the whole game. Cities do all the smelting, assembling and refining for you. You build them, free once researched, on the plots the map provides, and each one runs at half the rate of its vanilla equivalent, except the power cities. Your job is to mine ore, coal, oil and uranium and build the rail network that ships it from city to city, all the way to a rocket launch.\nCities, rails, trains, belts, inserters, miners and poles are free: research unlocks them. There are no furnaces or assemblers to build, and no biters.\nThe map is new each game: plots lie far apart on regular Nauvis terrain. Set the distance with the "City spacing" startup setting.

[tt-scenario]
welcome=Welcome to Tracktorio. Cities are free in the crafting menu and can only be built on plots, one city to a plot. Two plots stand near you, and every plot is marked on your map. You start with some coal fuel. Click a city to see its inputs, outputs and status.
