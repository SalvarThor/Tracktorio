scenario-name=Tracktorio
description=Factorio where the trains are the whole game. Cities do all the smelting, assembling and refining for you. You build them, free once researched, on the plots the map provides, and each one is modest, so a product soon comes from several cities. Your job is to mine ore, coal, oil and uranium and build the rail network that ships it from city to city, all the way to a rocket launch.\nCities, rails, trains, belts, inserters, miners and poles are free: research unlocks them. There are no furnaces or assemblers to build, and no biters.\nThe map is new each game: plots lie far apart on regular Nauvis terrain. Set the distance with the "City spacing" startup setting.

[tt-scenario]
welcome=Welcome to Tracktorio. The two plots near you are for a power city and a water city. Cities are free in the crafting menu, and build only on plots, one city to a plot; every plot is marked on your map, far apart, so cities trade by train. Your coal fuel depot and smelting cities go on the nearest ones. You start with some coal fuel. Once a city stands, click it to see what it needs.
