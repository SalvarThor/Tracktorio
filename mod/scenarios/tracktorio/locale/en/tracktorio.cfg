scenario-name=Tracktorio
description=Factorio where the trains are the whole game. Cities across the map do all the smelting, assembling and refining for you; your job is to mine ore, coal, oil and uranium and build the rail network that ships it from city to city, all the way to a rocket launch.\nRails, trains, belts, inserters, miners and poles are free: research unlocks them. There are no furnaces or assemblers to build, and no biters.\nThe map is new each game: cities are far apart on regular Nauvis terrain. Set the distance with the "City spacing" startup setting.

[tt-scenario]
welcome=Welcome to Tracktorio. The cities on your map turn what you deliver into what comes next; build the trains that feed them. You start with some coal fuel; the coal fuel depot near you makes more from coal. Click a city to see what it needs.