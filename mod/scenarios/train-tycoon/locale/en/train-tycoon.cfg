train-tycoon=Train Tycoon
description=Ship iron and copper plates by train from the smelting cities to the goal box. Cities convert what you deliver; your rail network is the factory.

[tt-scenario]
welcome=Welcome to Train Tycoon. Mine ore and coal, feed the cities by train, and deliver plates to the goal box (green on the map). Click a city for details. You start with some coal fuel; the depot city north of you makes more from coal.
