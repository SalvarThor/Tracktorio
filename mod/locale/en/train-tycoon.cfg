[entity-description]
tt-city-iron-smelting=Turns iron ore and coal into iron plates. Feed and drain it with inserters. Click it for details.
tt-city-copper-smelting=Turns copper ore and coal into copper plates. Feed and drain it with inserters. Click it for details.
tt-city-depot=Turns coal into coal fuel, the only fuel locomotives burn. Needs electricity: connect it to your pole network (up to 840 kW). Click it for details.
tt-city-power=Burns coal and water into electricity for your pole network. Pipe water in at the south side; connect a pole next to it. Click it for details.
tt-power-generator=Hidden part of the power city.
tt-city-goal=Deliver iron and copper plates here by train. Every plate counts towards the goal.
tt-city-iron-smelting-t2=Turns iron ore into iron plates with electricity, no coal needed. Needs up to 8.6 MW from your pole network. Click it for details.
tt-city-iron-smelting-t3=Turns iron ore into iron plates with electricity, no coal needed. Needs up to 17.3 MW from your pole network. Click it for details.
tt-city-copper-smelting-t2=Turns copper ore into copper plates with electricity, no coal needed. Needs up to 8.6 MW from your pole network. Click it for details.
tt-city-copper-smelting-t3=Turns copper ore into copper plates with electricity, no coal needed. Needs up to 17.3 MW from your pole network. Click it for details.
tt-city-depot-t2=Turns coal into coal fuel, the only fuel locomotives burn. Needs up to 1.7 MW from your pole network. Click it for details.
tt-city-depot-t3=Turns coal into coal fuel, the only fuel locomotives burn. Needs up to 3.4 MW from your pole network. Click it for details.
tt-city-power-t2=Burns coal and water into up to 10.8 MW for your pole network. Pipe water in at the south side; connect a pole next to it. Click it for details.
tt-city-power-t3=Burns coal and water into up to 21.6 MW for your pole network. Pipe water in at the south side; connect a pole next to it. Click it for details.

