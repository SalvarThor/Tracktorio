tt-power-generator=Hidden part of the power city.
tt-nuclear-generator=Hidden part of the nuclear power city.
tt-city-goal=Counts the iron and copper plates delivered here by train. The goal is now launching a rocket from the rocket silo city; this box no longer decides the win.
tt-construction-port=Deliver the materials for this city's next tier here with inserters. It only takes what is still needed; the city upgrades itself when everything has arrived.
tt-service-port=Deliver repair packs here with inserters. Trains stopped at a train stop near this depot are repaired with them.

[tt-city-description]
; City descriptions. The tooltip adds tt-gui.click-hint; the city window shows them as they are.
tt-city-iron-smelting=Turns iron ore and coal into iron plates. Feed and drain it with inserters.
tt-city-copper-smelting=Turns copper ore and coal into copper plates. Feed and drain it with inserters.
tt-city-depot=Turns coal into coal fuel, the basic locomotive fuel. Like every depot it services trains stopped nearby. Needs electricity: connect it to your pole network (up to 840 kW).
tt-city-power=Burns coal and water into electricity for your pole network. Pipe water in at the bottom middle; connect a pole next to it.
tt-city-iron-smelting-t2=Turns iron ore into iron plates with electricity, no coal needed. Needs up to 8.6 MW from your pole network.
tt-city-iron-smelting-t3=Turns iron ore into iron plates with electricity, no coal needed. Needs up to 17.3 MW from your pole network.
tt-city-copper-smelting-t2=Turns copper ore into copper plates with electricity, no coal needed. Needs up to 8.6 MW from your pole network.
tt-city-copper-smelting-t3=Turns copper ore into copper plates with electricity, no coal needed. Needs up to 17.3 MW from your pole network.
tt-city-depot-t2=Turns coal into coal fuel, the basic locomotive fuel. Like every depot it services trains stopped nearby. Needs up to 1.7 MW from your pole network.
tt-city-depot-t3=Turns coal into coal fuel, the basic locomotive fuel. Like every depot it services trains stopped nearby. Needs up to 3.4 MW from your pole network.
tt-city-power-t2=Burns coal and water into up to 10.8 MW for your pole network. Pipe water in at the bottom middle; connect a pole next to it.
tt-city-power-t3=Burns coal and water into up to 21.6 MW for your pole network. Pipe water in at the bottom middle; connect a pole next to it.
tt-city-circuits=Turns iron and copper plates into electronic circuits. Needs up to 1.25 MW from your pole network.
tt-city-circuits-t2=Turns iron and copper plates into electronic circuits. Needs up to 2.5 MW from your pole network.
tt-city-circuits-t3=Turns iron and copper plates into electronic circuits. Needs up to 5 MW from your pole network.
tt-city-red-science=Turns iron and copper plates into automation science packs. Needs up to 1.1 MW from your pole network.
tt-city-red-science-t2=Turns iron and copper plates into automation science packs. Needs up to 2.2 MW from your pole network.
tt-city-red-science-t3=Turns iron and copper plates into automation science packs. Needs up to 4.4 MW from your pole network.
tt-city-green-science=Turns iron plates and electronic circuits into logistic science packs. Needs up to 1.5 MW from your pole network.
tt-city-green-science-t2=Turns iron plates and electronic circuits into logistic science packs. Needs up to 3 MW from your pole network.
tt-city-green-science-t3=Turns iron plates and electronic circuits into logistic science packs. Needs up to 6 MW from your pole network.
tt-city-research=Researches with red, green and blue science packs, like 20 labs. Pick a research, then feed it packs with inserters. Needs up to 1.2 MW from your pole network.
tt-city-research-t2=Researches with red, green and blue science packs, like 40 labs. Needs up to 2.4 MW from your pole network.
tt-city-research-t3=Researches with red, green and blue science packs, like 80 labs. Needs up to 4.8 MW from your pole network.
tt-city-repair-packs=Turns iron plates and electronic circuits into repair packs for depot servicing. Needs up to 0.15 MW from your pole network.
tt-city-repair-packs-t2=Turns iron plates and electronic circuits into repair packs for depot servicing. Needs up to 0.3 MW from your pole network.
tt-city-repair-packs-t3=Turns iron plates and electronic circuits into repair packs for depot servicing. Needs up to 0.6 MW from your pole network.
tt-city-refinery=Turns crude oil and water into light oil and petroleum gas (heavy oil is cracked inside). Pipe crude oil in at the bottom left and water at the bottom right; take light oil out at the top left and petroleum gas at the top right. Needs up to 0.95 MW from your pole network.
tt-city-refinery-t2=Turns crude oil and water into light oil and petroleum gas (heavy oil is cracked inside). Pipe crude oil in at the bottom left and water at the bottom right; take light oil out at the top left and petroleum gas at the top right. Needs up to 1.9 MW from your pole network.
tt-city-refinery-t3=Turns crude oil and water into light oil and petroleum gas (heavy oil is cracked inside). Pipe crude oil in at the bottom left and water at the bottom right; take light oil out at the top left and petroleum gas at the top right. Needs up to 3.8 MW from your pole network.
tt-city-solid-fuel-depot=Turns light oil into solid fuel, a locomotive fuel with +20% acceleration and +5% top speed. Pipe light oil in at the bottom middle. Like every depot it services trains stopped nearby. Needs up to 0.42 MW from your pole network.
tt-city-solid-fuel-depot-t2=Turns light oil into solid fuel, a locomotive fuel with +20% acceleration and +5% top speed. Pipe light oil in at the bottom middle. Like every depot it services trains stopped nearby. Needs up to 0.84 MW from your pole network.
tt-city-solid-fuel-depot-t3=Turns light oil into solid fuel, a locomotive fuel with +20% acceleration and +5% top speed. Pipe light oil in at the bottom middle. Like every depot it services trains stopped nearby. Needs up to 1.68 MW from your pole network.
tt-city-rocket-fuel-depot=Turns solid fuel and light oil into rocket fuel, a locomotive fuel with +80% acceleration and +15% top speed. Pipe light oil in at the bottom middle; solid fuel goes in by inserter. Like every depot it services trains stopped nearby. Needs up to 0.6 MW from your pole network.
tt-city-rocket-fuel-depot-t2=Turns solid fuel and light oil into rocket fuel, a locomotive fuel with +80% acceleration and +15% top speed. Pipe light oil in at the bottom middle; solid fuel goes in by inserter. Like every depot it services trains stopped nearby. Needs up to 1.2 MW from your pole network.
tt-city-rocket-fuel-depot-t3=Turns solid fuel and light oil into rocket fuel, a locomotive fuel with +80% acceleration and +15% top speed. Pipe light oil in at the bottom middle; solid fuel goes in by inserter. Like every depot it services trains stopped nearby. Needs up to 2.4 MW from your pole network.
tt-city-steel=Turns iron plates into steel plates with electricity. Needs up to 1.44 MW from your pole network.
tt-city-steel-t2=Turns iron plates into steel plates with electricity. Needs up to 2.88 MW from your pole network.
tt-city-steel-t3=Turns iron plates into steel plates with electricity. Needs up to 5.76 MW from your pole network.
tt-city-processing-units=Turns electronic circuits, advanced circuits and sulfuric acid into processing units. Pipe sulfuric acid in at the bottom middle; the circuits go in by inserter. Needs up to 0.4 MW from your pole network.
tt-city-processing-units-t2=Turns electronic circuits, advanced circuits and sulfuric acid into processing units. Pipe sulfuric acid in at the bottom middle; the circuits go in by inserter. Needs up to 0.8 MW from your pole network.
tt-city-processing-units-t3=Turns electronic circuits, advanced circuits and sulfuric acid into processing units. Pipe sulfuric acid in at the bottom middle; the circuits go in by inserter. Needs up to 1.6 MW from your pole network.
tt-city-advanced-circuits=Turns electronic circuits, plastic bars and copper plates into advanced circuits. Needs up to 1.35 MW from your pole network.
tt-city-advanced-circuits-t2=Turns electronic circuits, plastic bars and copper plates into advanced circuits. Needs up to 2.7 MW from your pole network.
tt-city-advanced-circuits-t3=Turns electronic circuits, plastic bars and copper plates into advanced circuits. Needs up to 5.4 MW from your pole network.
tt-city-sulfuric-acid=Turns sulfur, iron plates and water into sulfuric acid. Pipe water in at the bottom middle and take the acid out at the top middle; sulfur and iron go in by inserter. Needs up to 0.1 MW from your pole network.
tt-city-sulfuric-acid-t2=Turns sulfur, iron plates and water into sulfuric acid. Pipe water in at the bottom middle and take the acid out at the top middle; sulfur and iron go in by inserter. Needs up to 0.2 MW from your pole network.
tt-city-sulfuric-acid-t3=Turns sulfur, iron plates and water into sulfuric acid. Pipe water in at the bottom middle and take the acid out at the top middle; sulfur and iron go in by inserter. Needs up to 0.4 MW from your pole network.
tt-city-sulfur=Turns petroleum gas and water into sulfur. Pipe petroleum gas in at the bottom left and water at the bottom right. Needs up to 0.11 MW from your pole network.
tt-city-sulfur-t2=Turns petroleum gas and water into sulfur. Pipe petroleum gas in at the bottom left and water at the bottom right. Needs up to 0.21 MW from your pole network.
tt-city-sulfur-t3=Turns petroleum gas and water into sulfur. Pipe petroleum gas in at the bottom left and water at the bottom right. Needs up to 0.42 MW from your pole network.
tt-city-plastic=Turns petroleum gas and coal into plastic bars. Pipe petroleum gas in at the bottom middle; coal goes in by inserter. Needs up to 0.32 MW from your pole network.
tt-city-plastic-t2=Turns petroleum gas and coal into plastic bars. Pipe petroleum gas in at the bottom middle; coal goes in by inserter. Needs up to 0.63 MW from your pole network.
tt-city-plastic-t3=Turns petroleum gas and coal into plastic bars. Pipe petroleum gas in at the bottom middle; coal goes in by inserter. Needs up to 1.26 MW from your pole network.
tt-city-low-density-structure=Turns steel, copper plates and plastic bars into low density structures, a rocket part ingredient. Needs up to 0.6 MW from your pole network.
tt-city-low-density-structure-t2=Turns steel, copper plates and plastic bars into low density structures, a rocket part ingredient. Needs up to 1.2 MW from your pole network.
tt-city-low-density-structure-t3=Turns steel, copper plates and plastic bars into low density structures, a rocket part ingredient. Needs up to 2.4 MW from your pole network.
tt-city-blue-science=Turns steel, iron plates, advanced circuits and sulfur into chemical science packs (engines are made inside). Needs up to 0.96 MW from your pole network.
tt-city-blue-science-t2=Turns steel, iron plates, advanced circuits and sulfur into chemical science packs (engines are made inside). Needs up to 1.92 MW from your pole network.
tt-city-blue-science-t3=Turns steel, iron plates, advanced circuits and sulfur into chemical science packs (engines are made inside). Needs up to 3.84 MW from your pole network.
tt-city-uranium=Turns uranium ore and iron plates into uranium fuel cells for the nuclear power city (the ore is enriched inside). Both go in by inserter. Needs up to 0.6 MW from your pole network.
tt-city-uranium-t2=Turns uranium ore and iron plates into uranium fuel cells for the nuclear power city (the ore is enriched inside). Both go in by inserter. Needs up to 1.2 MW from your pole network.
tt-city-uranium-t3=Turns uranium ore and iron plates into uranium fuel cells for the nuclear power city (the ore is enriched inside). Both go in by inserter. Needs up to 2.4 MW from your pole network.
tt-city-nuclear-power=Turns uranium fuel cells and water into electricity on your pole network, up to 20 MW. Fuel cells go in by inserter (one lasts 400 s at full output) and water is piped in at the bottom middle. Like a real reactor it can't throttle: with fuel in, it burns at its full rate whether the power is used or not.
tt-city-nuclear-power-t2=Turns uranium fuel cells and water into electricity on your pole network, up to 40 MW. Fuel cells go in by inserter (one lasts 200 s at full output) and water is piped in at the bottom middle. Like a real reactor it can't throttle: with fuel in, it burns at its full rate whether the power is used or not.
tt-city-nuclear-power-t3=Turns uranium fuel cells and water into electricity on your pole network, up to 80 MW. Fuel cells go in by inserter (one lasts 100 s at full output) and water is piped in at the bottom middle. Like a real reactor it can't throttle: with fuel in, it burns at its full rate whether the power is used or not.
tt-city-rocket-silo=Builds a rocket from rocket parts (processing units, low density structures and rocket fuel) and launches it as soon as it is complete. Launching the first rocket wins the game. Needs electricity from your pole network (up to 4 MW while building).

