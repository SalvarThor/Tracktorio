tt-city-iron-smelting=Iron smelting city
tt-city-copper-smelting=Copper smelting city
tt-city-depot=Depot city
tt-city-power=Power city
tt-power-generator=Power city generator
tt-city-goal=Goal box
tt-city-iron-smelting-t2=Iron smelting city (tier 2)
tt-city-iron-smelting-t3=Iron smelting city (tier 3)
tt-city-copper-smelting-t2=Copper smelting city (tier 2)
tt-city-copper-smelting-t3=Copper smelting city (tier 3)
