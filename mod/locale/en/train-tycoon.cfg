[mod-name]
train-tycoon=Train Tycoon

[mod-description]
train-tycoon=Trains are the whole game. Fixed-location cities do the production; you build the network that feeds them.

[entity-name]
tt-city-iron-smelting=Iron smelting city
tt-city-copper-smelting=Copper smelting city
tt-city-depot=Depot city
tt-city-power=Power city
tt-power-generator=Power city generator
tt-city-goal=Goal box

[entity-description]
tt-city-iron-smelting=Turns iron ore and coal into iron plates. Feed and drain it with inserters.
tt-city-copper-smelting=Turns copper ore and coal into copper plates. Feed and drain it with inserters.
tt-city-depot=Turns coal into coal fuel, the only fuel locomotives burn.
tt-city-power=Burns coal and water into electricity for your pole network. Pipe water in at the south side; connect a pole next to it.
tt-power-generator=Hidden part of the power city.
tt-city-goal=Deliver iron and copper plates here by train. Every plate counts towards the goal.

