[entity-description]
tt-power-generator=Hidden part of the power city.
tt-city-goal=Deliver iron and copper plates here by train. Every plate counts towards the goal.
tt-construction-port=Deliver the materials for this city's next tier here with inserters. It only takes what is still needed; the city upgrades itself when everything has arrived.

[tt-city-description]
; City descriptions. The tooltip adds tt-gui.click-hint; the city window shows them as they are.
tt-city-iron-smelting=Turns iron ore and coal into iron plates. Feed and drain it with inserters.
tt-city-copper-smelting=Turns copper ore and coal into copper plates. Feed and drain it with inserters.
tt-city-depot=Turns coal into coal fuel, the only fuel locomotives burn. Needs electricity: connect it to your pole network (up to 840 kW).
tt-city-power=Burns coal and water into electricity for your pole network. Pipe water in at the south side; connect a pole next to it.
tt-city-iron-smelting-t2=Turns iron ore into iron plates with electricity, no coal needed. Needs up to 8.6 MW from your pole network.
tt-city-iron-smelting-t3=Turns iron ore into iron plates with electricity, no coal needed. Needs up to 17.3 MW from your pole network.
tt-city-copper-smelting-t2=Turns copper ore into copper plates with electricity, no coal needed. Needs up to 8.6 MW from your pole network.
tt-city-copper-smelting-t3=Turns copper ore into copper plates with electricity, no coal needed. Needs up to 17.3 MW from your pole network.
tt-city-depot-t2=Turns coal into coal fuel, the only fuel locomotives burn. Needs up to 1.7 MW from your pole network.
tt-city-depot-t3=Turns coal into coal fuel, the only fuel locomotives burn. Needs up to 3.4 MW from your pole network.
tt-city-power-t2=Burns coal and water into up to 10.8 MW for your pole network. Pipe water in at the south side; connect a pole next to it.
tt-city-power-t3=Burns coal and water into up to 21.6 MW for your pole network. Pipe water in at the south side; connect a pole next to it.
tt-city-circuits=Turns iron and copper plates into electronic circuits. Needs up to 1.25 MW from your pole network.
tt-city-circuits-t2=Turns iron and copper plates into electronic circuits. Needs up to 2.5 MW from your pole network.
tt-city-circuits-t3=Turns iron and copper plates into electronic circuits. Needs up to 5 MW from your pole network.
tt-city-red-science=Turns iron and copper plates into automation science packs. Needs up to 1.1 MW from your pole network.
tt-city-red-science-t2=Turns iron and copper plates into automation science packs. Needs up to 2.2 MW from your pole network.
tt-city-red-science-t3=Turns iron and copper plates into automation science packs. Needs up to 4.4 MW from your pole network.
tt-city-green-science=Turns iron plates and electronic circuits into logistic science packs. Needs up to 1.5 MW from your pole network.
tt-city-green-science-t2=Turns iron plates and electronic circuits into logistic science packs. Needs up to 3 MW from your pole network.
tt-city-green-science-t3=Turns iron plates and electronic circuits into logistic science packs. Needs up to 6 MW from your pole network.
tt-city-research=Researches with red and green science packs, like 20 labs. Pick a research, then feed it packs with inserters. Needs up to 1.2 MW from your pole network.
tt-city-research-t2=Researches with red and green science packs, like 40 labs. Needs up to 2.4 MW from your pole network.
tt-city-research-t3=Researches with red and green science packs, like 80 labs. Needs up to 4.8 MW from your pole network.

