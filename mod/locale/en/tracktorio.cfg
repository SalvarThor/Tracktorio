[entity-description]
tt-power-generator=Hidden part of the power city.
tt-nuclear-generator=Hidden part of the nuclear power city.
tt-city-goal=Counts the iron and copper plates delivered here by train. The goal is now launching a rocket from the rocket silo city; this box no longer decides the win.
tt-belt-port-service=Belt repair packs in here. Trains stopped at a train stop near this depot are repaired with them.
tt-locomotive-2=More power, a higher top speed and better fuel use than the first locomotive, and it wears out slower: fewer breakdowns.
tt-locomotive-3=The best locomotive: the most power, the highest top speed, the best fuel use, and it wears out slowest.
tt-signal-point=Wire this to read the city: every item and fluid it holds, whether it is running, starved, output full or without power, and its speed. Use it to set train limits or call trains.
tt-belt-port=Run a belt into this port to deliver the item shown, or out of it to collect the item shown. The arrow says which way items go.
tt-service-port=Takes repair packs from the depot's service port in the wall. Trains stopped at a train stop near this depot are repaired with them.

[tt-city-description]
; City descriptions. The tooltip adds tt-gui.click-hint; the city window shows them as they are.
tt-city-iron-smelting=Turns iron ore and coal into iron plates. Run belts into and out of its ports.
tt-city-copper-smelting=Turns copper ore and coal into copper plates. Run belts into and out of its ports.
tt-city-electric-iron-smelting=Turns iron ore into iron plates with electricity, no coal needed. Needs up to 2.15 MW from your pole network. Replaces an iron smelting city in place with the upgrade planner.
tt-city-electric-copper-smelting=Turns copper ore into copper plates with electricity, no coal needed. Needs up to 2.15 MW from your pole network. Replaces a copper smelting city in place with the upgrade planner.
tt-city-depot=Turns coal into coal fuel, the basic locomotive fuel. Like every depot it services trains stopped nearby. Needs electricity: connect it to your pole network (up to 420 kW).
tt-city-power=Burns coal and water into electricity for your pole network. Pipe water into its water port; connect a pole next to it.
tt-city-circuits=Turns iron and copper plates into electronic circuits. Needs up to 0.625 MW from your pole network.
tt-city-red-science=Turns iron and copper plates into automation science packs. Needs up to 0.55 MW from your pole network.
tt-city-green-science=Turns iron plates and electronic circuits into logistic science packs. Needs up to 0.75 MW from your pole network.
tt-city-research=Researches with red, green and blue science packs, like 10 labs. Pick a research, then belt packs into its ports. Needs up to 0.6 MW from your pole network.
tt-city-repair-packs=Turns iron plates and electronic circuits into repair packs for depot servicing. Needs up to 0.075 MW from your pole network.
tt-city-refinery=Turns crude oil and water into light oil and petroleum gas (heavy oil is cracked inside). Pipe crude oil and water into its ports, and light oil and petroleum gas out of them. Needs up to 0.475 MW from your pole network.
tt-city-solid-fuel-depot=Turns light oil into solid fuel, a locomotive fuel with +20% acceleration and +5% top speed. Pipe light oil into its port. Like every depot it services trains stopped nearby. Needs up to 0.21 MW from your pole network.
tt-city-rocket-fuel-depot=Turns solid fuel and light oil into rocket fuel, a locomotive fuel with +80% acceleration and +15% top speed. Pipe light oil and belt solid fuel into its ports. Like every depot it services trains stopped nearby. Needs up to 0.3 MW from your pole network.
tt-city-steel=Turns iron plates into steel plates with electricity. Needs up to 0.72 MW from your pole network.
tt-city-processing-units=Turns electronic circuits, advanced circuits and sulfuric acid into processing units. Pipe sulfuric acid and belt the circuits into its ports. Needs up to 0.2 MW from your pole network.
tt-city-advanced-circuits=Turns electronic circuits, plastic bars and copper plates into advanced circuits. Needs up to 0.675 MW from your pole network.
tt-city-sulfuric-acid=Turns sulfur, iron plates and water into sulfuric acid. Pipe water in and acid out, and belt sulfur and iron in, through its ports. Needs up to 0.05 MW from your pole network.
tt-city-sulfur=Turns petroleum gas and water into sulfur. Pipe petroleum gas and water into its ports. Needs up to 0.055 MW from your pole network.
tt-city-plastic=Turns petroleum gas and coal into plastic bars. Pipe petroleum gas and belt coal into its ports. Needs up to 0.16 MW from your pole network.
tt-city-low-density-structure=Turns steel, copper plates and plastic bars into low density structures, a rocket part ingredient. Needs up to 0.3 MW from your pole network.
tt-city-blue-science=Turns steel, iron plates, advanced circuits and sulfur into chemical science packs (engines are made inside). Needs up to 0.48 MW from your pole network.
tt-city-uranium=Turns uranium ore and iron plates into uranium fuel cells for the nuclear power city (the ore is enriched inside). Both go in by belt, through its ports. Needs up to 0.3 MW from your pole network.
tt-city-water=Pumps water: the only source of water on the map. Needs no inputs and no power. Pipe the water out of its port and ship it by fluid wagon to the cities that use it. Up to 300 water/s.
tt-city-nuclear-power=Turns uranium fuel cells and water into electricity on your pole network, up to 10 MW. Fuel cells go in by belt (one lasts 800 s at full output) and water by pipe, through its ports. Like a real reactor it can't throttle: with fuel in, it burns at its full rate whether the power is used or not.
tt-city-rocket-silo=Builds a rocket from rocket parts (processing units, low density structures and rocket fuel) and launches it as soon as it is complete. Launching the first rocket wins the game. Needs electricity from your pole network (up to 4 MW while building).

